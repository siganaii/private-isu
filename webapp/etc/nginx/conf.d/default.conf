# アプリへの接続を使い回す。リクエストごとに接続すると TIME_WAIT が溜まり、
# エフェメラルポートが枯渇して 502 になる
upstream app {
  server app:8080;
  keepalive 64;
}

server {
  listen 80;

  client_max_body_size 10m;
  # 投稿画像（1MB 前後）を一時ファイルに書かず、メモリで受け取る
  client_body_buffer_size 2m;
  root /public/;

  # 画像・静的ファイルの open/stat の結果を使い回す。リクエストの大半はこれらへの 304
  open_file_cache max=20000 inactive=60s;
  open_file_cache_valid 30s;
  # 「ファイルが無い」は覚えない。覚えると投稿直後の画像が最大30秒アプリに回る
  open_file_cache_errors off;

  # 画像・静的ファイルはアクセスログを書かない。1回の計測で約105万件あり、
  # LTSV の組み立てが nginx の CPU を使う。alp で見たいのは動的ページだけ

  # 画像はファイルがあれば nginx が直接返し、無ければアプリに回す
  location /image/ {
    expires 1d;
    access_log off;
    try_files $uri @app;
  }

  # CSS・JS・アイコンなどの静的ファイルは nginx が直接返す
  location ~ ^/(css|js|img)/ {
    expires 1d;
    access_log off;
  }

  location = /favicon.ico {
    expires 1d;
    access_log off;
  }

  location / {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }

  location @app {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }
}
