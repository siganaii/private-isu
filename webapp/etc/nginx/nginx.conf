user  nginx;
worker_processes  auto;

# worker_connections を増やすので、開けるファイル数の上限も上げる（既定は 1024）
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    # 既定の 1024 では足りず、ベンチ中に "worker_connections are not enough" が出ていた
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 既定の access.log（/dev/stdout → docker のログ）は書かない。
    # 計測用の alp ログだけを conf.d/00-alp-log.conf で出す

    sendfile        on;
    tcp_nopush      on;

    # ベンチマーカーは使い終わったクライアントの接続を閉じずに捨てるので、既定の 65 秒だと
    # 接続が残り続け、ベンチマーカー側のポートが枯渇する（cannot assign requested address）。
    # 使われていない接続は早めにこちらから閉じる
    keepalive_timeout  5;

    include /etc/nginx/conf.d/*.conf;
}
